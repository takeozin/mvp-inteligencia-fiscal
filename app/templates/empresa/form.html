{% extends 'base.html' %}
{% block title %}Cadastrar Empresa{% endblock %}

{% block content %}
<div style="max-width:520px;">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:24px;">
        <a href="{{ url_for('empresa.index') }}" class="btn">← Voltar</a>
        <h2 style="margin-bottom:0;">Cadastrar Nova Empresa</h2>
    </div>

    <div class="card">
        <form method="POST" action="{{ url_for('empresa.nova_empresa') }}">
            <div class="form-group">
                <label for="cnpj">CNPJ *</label>
                <input type="text" id="cnpj" name="cnpj"
                       value="{{ cnpj or '' }}"
                       placeholder="00.000.000/0000-00"
                       maxlength="18"
                       oninput="mascararCNPJ(this)"
                       required>
                <span class="hint">Digite os 14 dígitos — a máscara é aplicada automaticamente.</span>
            </div>

            <div class="form-group">
                <label for="nome">Razão Social / Nome *</label>
                <input type="text" id="nome" name="nome"
                       value="{{ nome or '' }}"
                       placeholder="Ex: Comércio ABC Ltda"
                       maxlength="200"
                       required>
            </div>

            <div class="flex-gap">
                <button type="submit" class="btn btn-primary">Salvar Empresa</button>
                <a href="{{ url_for('empresa.index') }}" class="btn">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script>
function mascararCNPJ(input) {
    let v = input.value.replace(/\D/g, '').substring(0, 14);
    if (v.length > 12) v = v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})/, '$1.$2.$3/$4-$5');
    else if (v.length > 8)  v = v.replace(/^(\d{2})(\d{3})(\d{3})(\d{0,4})/, '$1.$2.$3/$4');
    else if (v.length > 5)  v = v.replace(/^(\d{2})(\d{3})(\d{0,3})/, '$1.$2.$3');
    else if (v.length > 2)  v = v.replace(/^(\d{2})(\d{0,3})/, '$1.$2');
    input.value = v;
}
</script>
{% endblock %}
