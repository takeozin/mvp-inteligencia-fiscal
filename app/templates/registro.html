<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta — MVP Inteligência Fiscal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-deep: #080814; --bg-mid: #0f0f23;
            --bg-card: rgba(26, 26, 62, 0.55);
            --accent: #6c63ff; --accent-lt: #8b84ff; --accent-dk: #4a43cc;
            --text-main: #e8e8f0; --text-muted: #7a7a9a;
            --border: rgba(108, 99, 255, 0.25); --border-focus: rgba(108, 99, 255, 0.7);
            --error-bg: rgba(220,53,69,0.15); --error-bdr: rgba(220,53,69,0.4); --error-txt: #ff7b87;
            --success-bg: rgba(25,195,125,0.12); --success-bdr: rgba(25,195,125,0.35); --success-txt: #3dd68c;
        }
        html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg-deep); color: var(--text-main); }
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(ellipse 80% 60% at 20% 20%, rgba(108,99,255,0.18) 0%, transparent 60%),
                        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(245,197,66,0.07) 0%, transparent 55%);
        }
        body::after {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .wrapper { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
        .card {
            width: 100%; max-width: 440px;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
            padding: 44px 40px 40px; backdrop-filter: blur(24px);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset, 0 32px 64px rgba(0,0,0,0.5);
            animation: fadeUp 0.5s ease both;
        }
        @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo-icon { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: linear-gradient(135deg, var(--accent), var(--accent-dk)); border-radius: 16px; font-size: 26px; margin-bottom: 12px; box-shadow: 0 8px 24px rgba(108,99,255,0.35); }
        .logo h1 { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
        .logo p { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
        .flash { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 20px; border: 1px solid; }
        .flash.erro    { background: var(--error-bg);   border-color: var(--error-bdr);   color: var(--error-txt); }
        .flash.sucesso { background: var(--success-bg); border-color: var(--success-bdr); color: var(--success-txt); }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.03em; text-transform: uppercase; }
        .input-wrap { position: relative; }
        .input-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); transition: color 0.2s; pointer-events: none; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
            border-radius: 10px; padding: 13px 14px 13px 44px; color: var(--text-main);
            font-size: 0.95rem; font-family: inherit; transition: border-color 0.2s, background 0.2s, box-shadow 0.2s; outline: none;
        }
        input:focus { border-color: var(--border-focus); background: rgba(108,99,255,0.07); box-shadow: 0 0 0 3px rgba(108,99,255,0.15); }
        .input-wrap:focus-within svg { color: var(--accent-lt); }
        input::placeholder { color: rgba(122,122,154,0.6); }
        .btn-primary { width: 100%; padding: 14px; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-dk)); color: #fff; font-size: 0.95rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s, filter 0.2s; margin-top: 8px; box-shadow: 0 4px 16px rgba(108,99,255,0.3); }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(108,99,255,0.45); filter: brightness(1.08); }
        .back-link { text-align: center; margin-top: 22px; font-size: 0.83rem; color: var(--text-muted); }
        .back-link a { color: var(--accent-lt); text-decoration: none; font-weight: 500; }
        .back-link a:hover { color: #fff; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="logo">
            <div class="logo-icon">⚖</div>
            <h1>Criar Conta</h1>
            <p>Inteligência Fiscal — Tema 69 STF</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for categoria, msg in messages %}
                <div class="flash {{ categoria }}">
                    {% if categoria == 'erro' %}⚠{% else %}✓{% endif %} {{ msg }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.registro') }}" novalidate>

            <div class="form-group">
                <label for="nome">Nome completo</label>
                <div class="input-wrap">
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" autocomplete="name" required autofocus>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <div class="input-wrap">
                    <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha (mín. 6 caracteres)</label>
                <div class="input-wrap">
                    <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="new-password" required>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmacao">Confirmar senha</label>
                <div class="input-wrap">
                    <input type="password" id="confirmacao" name="confirmacao" placeholder="••••••••" autocomplete="new-password" required>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
            </div>

            <button type="submit" class="btn-primary">Criar conta</button>
        </form>

        <div class="back-link">
            Já tem conta? <a href="{{ url_for('auth.login') }}">Fazer login</a>
        </div>
    </div>
</div>
</body>
</html>
